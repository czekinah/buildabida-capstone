name: Docs check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  links:
    name: Check links in Markdown files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
