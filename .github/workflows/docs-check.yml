name: Docs check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  links:
    name: Check links in Markdown files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  markdown:
    name: Check Markdown layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  writing:
    name: Give writing tips
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Check our writing rules
        uses: vale-cli/vale-action@v3
