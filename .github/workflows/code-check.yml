name: Code check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff:
    name: Check Python code with Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Look for mistakes
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"

      - name: Check the format of our modules
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          args: "format --check --diff"
